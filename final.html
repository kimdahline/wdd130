```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Website</title>

    <link rel="stylesheet" href="style1.css">
</head>

<body>

    <header>
        <h1>My Shopping Store Website</h1>

        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section>
            <h2>Items I Sell in My Store</h2>

            <div class="items">
                <ul>
                    <li>Shoes</li>
                    <li>Bags</li>
                    <li>Jeans</li>
                    <li>Sweater pants</li>
                </ul>
            </div>

        </section>

        <section>
            <h3>Location of My Store</h3>

            <div class="store-location">

                <p>
                    My store is located in
                    <span class="location">Entebbe</span>.
                </p>

                <p>
                    Entebbe was the former capital city of
                    <span class="country">Uganda</span>.
                </p>

            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2025 My Shopping Store</p>
    </footer>

</body>

</html>
