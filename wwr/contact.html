<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
      content="Contact White Water Rafting Company for rafting information, reservations, questions, and customer support.">

    <meta name="author" content="Dahline Kim">

    <link rel="stylesheet" href="styles/rafting.css">

    <title> Rafting Travel | Contact Us</title>
</head>

<body>

    <header>
        <img src="images/log-for-water-rafting.jpg" alt="White Water Rafting Company logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <!-- Company Information -->
        <section class="company-information">

            <h1>RAFTINF TRAVEL</h1>

            <p>1793 Entebbe Road</p>
            <p>Kitende, Uganda</p>
            <p>
                <a href="tel:+256757656042">+256 757656042</a>
            </p>
            <p>
                <a href="mailto:kimdahline1@gmail.com">
                    kimdahline1@gmail.com
                </a>
            </p>

        </section>


        <!-- Map and Contact Form -->
        <section class="contact-area">

            <!-- Google Map -->
            <div class="map">

                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d8769.673366551833!2d32.53592366055948!3d0.19746407324662024!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x177d97004cc3168d%3A0xcfa2dd9b00b315b7!2sKitende%20Entebbe%20road!5e0!3m2!1sen!2sug!4v1790528547678!5m2!1sen!2sug"
                  width="600" height="450" allowfullscreen loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"
                  title="Map showing the location of White Water Rafting Company">
                </iframe>

            </div>


            <!-- Contact Form -->
            <form class="contact-form">

                <div class="form-item">

                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required placeholder="Kim Dahline">

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required
                      placeholder="kimdahline1@gmail.com">


                    <p class="form-label">Message Purpose</p>

                    <div class="radio-option">
                        <input type="radio" id="general" name="messagepurpose"
                          value="general inquiry" required>

                        <label for="general">
                            General Inquiry
                        </label>
                    </div>


                    <div class="radio-option">
                        <input type="radio" id="reservation" name="messagepurpose"
                          value="reservation question">

                        <label for="reservation">
                            Reservation Question
                        </label>
                    </div>


                    <div class="radio-option">
                        <input type="radio" id="suggestion" name="messagepurpose"
                          value="website suggestion">

                        <label for="suggestion">
                            Website Suggestion
                        </label>
                    </div>


                    <label for="message">Message:</label>

                    <textarea id="message" name="message" rows="5"
                      placeholder="Type your message here..." required></textarea>


                    <div class="checkbox-option">

                        <input type="checkbox" id="subscribe" name="subscribe">

                        <label for="subscribe">
                            Please subscribe me to the monthly newsletter
                        </label>

                    </div>


                    <button type="submit">
                        Get in Touch
                    </button>

                </div>

            </form>

        </section>


        <!-- Employee Profiles -->
        <section class="employee-section">

            <h2>We Are Here to Serve You</h2>

            <div class="employee-gallery">

                <figure>
                    <img src="images/rafting-through.jpg" alt="Rafting trip guide">

                    <figcaption>
                        Trip Guide
                    </figcaption>
                </figure>


                <figure>
                    <img src="images/working-client.jfif" alt="Customer service representative">

                    <figcaption>
                        Customer Service Representative
                    </figcaption>
                </figure>


                <figure>
                    <img src="images/thunder.jfif" alt="Rafting safety coordinator">

                    <figcaption>
                        Safety Coordinator
                    </figcaption>
                </figure>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            &copy; 2026 💦 Rafting Travel, Dahline Kimbugwe
        </p>

        <nav class="socialmedia">

            <a href="https://facebook.com">
                <img src="images/facebook-logo.png" alt="Facebook">
            </a>

            <a href="https://linkedin.com">
                <img src="images/in-logo.png" alt="LinkedIn">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.jfif" alt="Instagram">
            </a>

        </nav>

    </footer>

</body>

</html>
