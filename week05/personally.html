<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/table-exercise-solution.css">
    <title>Table Exercise</title>
</head>

<body>
    <h1>Table showing the teams success over the years </h1>
    <table>
        <thead>
            <tr>
                <th>Region</th>
                <th>Team</th>
                <th>Champions League</th>
                <th>Premier League</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="3">North London</th>
                <td>Arsenal</td>
                <td>0</td>
                <td>8</td>
            </tr>
            <tr>
                <td>Chelsea</td>
                <td>3</td>
                <td>9</td>
            </tr>
            <tr>
                <td>Aston Villa</td>
                <td>1</td>
                <td>5</td>
            </tr>
            <tr>
                <th rowspan="2">Manchester</th>
                <td>Man city</td>
                <td>1</td>
                <td>8</td>
            </tr>
            <tr>
                <td>Man united</td>
                <td>3</td>
                <td>20</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th rowspan="2">Total Trophies Won In England In Each Department</th>
                <td></td>
                <td>8</td>
                <td>50</td>
            </tr>
        </tfoot>
    </table>
</body>
